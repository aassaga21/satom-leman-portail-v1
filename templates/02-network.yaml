AWSTemplateFormatVersion: "2010-09-09"
Description: >
  SatomCloudNetwork - Reseau (sprints 1-2) : VPC, 5 sous-reseaux sur 2 AZ, IGW, NAT,
  tables de routage. Les sections des sprints 3 (NACL) et 4 (Network Firewall) seront ajoutees ensuite.
  Stack stack-leman-<env>-network.

Metadata:
  cfn-lint:
    config:
      # Les parametres ci-dessous sont transmis par scripts/deploy.sh depuis parameters/<env>.json.
      # PeerVpcCidr (sprint 3) et AllowedDomains (sprint 4) ne sont pas encore utilises.
      ignore_checks:
        - W2001

Parameters:
  Env:
    Type: String
    AllowedValues: [dev, prod]
  Suffix:
    Type: String
    Default: AA
  Team:
    Type: String
    Default: Assaga
  VpcCidr:
    Type: String
    Description: "prod 10.0.0.0/16 - dev 10.1.0.0/16"
  PublicSubnet1aCidr:
    Type: String
  PrivateSubnet1aCidr:
    Type: String
  PrivateSubnet1bCidr:
    Type: String
  FirewallSubnet1aCidr:
    Type: String
  PublicSubnet1bCidr:
    Type: String
  PeerVpcCidr:
    Type: String
    Description: CIDR du VPC homologue (utilise au sprint 3, NACL privee)
  EnableNatGateway:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
  EnableFirewall:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "false"
    Description: Sprint 2 (choix de la route privee) et sprint 4 - attention au cout horaire du pare-feu
  AllowedDomains:
    Type: CommaDelimitedList
    Default: ".amazonaws.com,.amazonlinux.com"
    Description: Utilise au sprint 4 - liste blanche de domaines (SNI TLS / Host HTTP)

Conditions:
  CreateNat: !Equals [!Ref EnableNatGateway, "true"]
  NatOnly: !And [!Condition CreateNat, !Not [!Equals [!Ref EnableFirewall, "true"]]]

Resources:
  # ---------------- Sprint 1 : VPC et sous-reseaux ----------------
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - { Key: Name, Value: !Sub "vpc-${Env}-leman-${Suffix}" }
        - { Key: Projet, Value: SatomCloudNetwork }
        - { Key: Equipe, Value: !Ref Team }
        - { Key: Environnement, Value: !Ref Env }

  # Le groupe de securite par defaut est vide (aucune regle) - bonne pratique CIS
  PublicSubnet1a:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnet1aCidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: !Sub "sub-public-1a-${Env}-${Suffix}" }
        - { Key: Tier, Value: public }
        - { Key: Projet, Value: SatomCloudNetwork }
        - { Key: Equipe, Value: !Ref Team }
        - { Key: Environnement, Value: !Ref Env }

  PublicSubnet1b:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PublicSubnet1bCidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: !Sub "sub-public-1b-${Env}-${Suffix}" }
        - { Key: Tier, Value: public }
        - { Key: Projet, Value: SatomCloudNetwork }
        - { Key: Equipe, Value: !Ref Team }
        - { Key: Environnement, Value: !Ref Env }

  PrivateSubnet1a:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnet1aCidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: !Sub "sub-private-1a-${Env}-${Suffix}" }
        - { Key: Tier, Value: private }
        - { Key: Projet, Value: SatomCloudNetwork }
        - { Key: Equipe, Value: !Ref Team }
        - { Key: Environnement, Value: !Ref Env }

  PrivateSubnet1b:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref PrivateSubnet1bCidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: !Sub "sub-private-1b-${Env}-${Suffix}" }
        - { Key: Tier, Value: private }
        - { Key: Projet, Value: SatomCloudNetwork }
        - { Key: Equipe, Value: !Ref Team }
        - { Key: Environnement, Value: !Ref Env }

  FirewallSubnet1a:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: !Ref FirewallSubnet1aCidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - { Key: Name, Value: !Sub "sub-fw-1a-${Env}-${Suffix}" }
        - { Key: Tier, Value: firewall }
        - { Key: Projet, Value: SatomCloudNetwork }
        - { Key: Equipe, Value: !Ref Team }
        - { Key: Environnement, Value: !Ref Env }

  # ---------------- Sprint 2 : routage ----------------
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - { Key: Name, Value: !Sub "igw-${Env}-leman-${Suffix}" }
        - { Key: Projet, Value: SatomCloudNetwork }
        - { Key: Equipe, Value: !Ref Team }
        - { Key: Environnement, Value: !Ref Env }

  IgwAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub "rt-public-${Env}-${Suffix}" }
        - { Key: Projet, Value: SatomCloudNetwork }
        - { Key: Equipe, Value: !Ref Team }
        - { Key: Environnement, Value: !Ref Env }

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: IgwAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1aRta:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1a
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet1bRta:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1b
      RouteTableId: !Ref PublicRouteTable

  NatEip:
    Type: AWS::EC2::EIP
    Condition: CreateNat
    DependsOn: IgwAttachment
    Properties:
      Domain: vpc
      Tags:
        - { Key: Name, Value: !Sub "eip-nat-${Env}-${Suffix}" }
        - { Key: Projet, Value: SatomCloudNetwork }
        - { Key: Equipe, Value: !Ref Team }
        - { Key: Environnement, Value: !Ref Env }

  NatGateway:
    Type: AWS::EC2::NatGateway
    Condition: CreateNat
    Properties:
      AllocationId: !GetAtt NatEip.AllocationId
      SubnetId: !Ref PublicSubnet1a
      Tags:
        - { Key: Name, Value: !Sub "nat-${Env}-leman-${Suffix}" }
        - { Key: Projet, Value: SatomCloudNetwork }
        - { Key: Equipe, Value: !Ref Team }
        - { Key: Environnement, Value: !Ref Env }

  # Une table privee partagee par les 2 sous-reseaux prives : AUCUNE route vers l'IGW
  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub "rt-private-${Env}-${Suffix}" }
        - { Key: Projet, Value: SatomCloudNetwork }
        - { Key: Equipe, Value: !Ref Team }
        - { Key: Environnement, Value: !Ref Env }

  PrivateDefaultRouteViaNat:
    Type: AWS::EC2::Route
    Condition: NatOnly
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

  PrivateSubnet1aRta:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1a
      RouteTableId: !Ref PrivateRouteTable

  PrivateSubnet1bRta:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1b
      RouteTableId: !Ref PrivateRouteTable

  FirewallRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags:
        - { Key: Name, Value: !Sub "rt-fw-${Env}-${Suffix}" }
        - { Key: Projet, Value: SatomCloudNetwork }
        - { Key: Equipe, Value: !Ref Team }
        - { Key: Environnement, Value: !Ref Env }

  FirewallSubnet1aRta:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref FirewallSubnet1a
      RouteTableId: !Ref FirewallRouteTable

Outputs:
  VpcId:
    Value: !Ref Vpc
    Export: { Name: !Sub "leman-${Env}-VpcId" }
  VpcCidr:
    Value: !Ref VpcCidr
    Export: { Name: !Sub "leman-${Env}-VpcCidr" }
  PublicSubnet1a:
    Value: !Ref PublicSubnet1a
    Export: { Name: !Sub "leman-${Env}-PublicSubnet1a" }
  PublicSubnet1b:
    Value: !Ref PublicSubnet1b
    Export: { Name: !Sub "leman-${Env}-PublicSubnet1b" }
  PrivateSubnet1a:
    Value: !Ref PrivateSubnet1a
    Export: { Name: !Sub "leman-${Env}-PrivateSubnet1a" }
  PrivateSubnet1b:
    Value: !Ref PrivateSubnet1b
    Export: { Name: !Sub "leman-${Env}-PrivateSubnet1b" }
  PrivateRouteTableId:
    Value: !Ref PrivateRouteTable
    Export: { Name: !Sub "leman-${Env}-PrivateRouteTable" }
